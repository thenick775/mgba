name: Build mgba-wasm

on:
  push:
    branches: ["**"]
  pull_request:

permissions:
  actions: write
  contents: read

jobs:
  change-detect:
    runs-on: ubuntu-latest
    outputs:
      should_skip: ${{ steps.skip_check.outputs.should_skip }}

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - id: skip_check
        uses: fkirc/skip-duplicate-actions@v5
        with:
          concurrent_skipping: "same_content_newer"
          cancel_others: "true"

  wasm-docker-build:
    needs: change-detect
    if: needs.change-detect.outputs.should_skip != 'true'
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup Node
        uses: actions/setup-node@v7
        with:
          node-version-file: src/platform/wasm/.nvmrc
          cache: npm
          cache-dependency-path: src/platform/wasm/package-lock.json

      - name: Build image
        working-directory: src/platform/wasm
        run: |
          set -euo pipefail

          npm run build:image && \
          docker image inspect local-mgba/wasm:2.0 >/dev/null

      - name: Build artifacts
        working-directory: src/platform/wasm
        run: |
          set -euo pipefail

          mkdir -p "${GITHUB_WORKSPACE}/build-wasm"
          chmod 0777 "${GITHUB_WORKSPACE}/build-wasm"

          npm run build

      - name: Prepare dist/
        working-directory: src/platform/wasm
        run: npm run prepare

      - name: Ensure output
        working-directory: src/platform/wasm
        run: |
          set -euo pipefail

          test -f dist/mgba.js
          test -f dist/mgba.d.ts
          test -f dist/mgba.wasm 
          test -f dist/mgba.wasm.map

          ls -larth dist

      - name: Upload dist artifact
        uses: actions/upload-artifact@v6
        with:
          name: mgba-wasm-dist
          path: src/platform/wasm/dist
